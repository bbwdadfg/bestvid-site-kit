[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bestvid-site-kit"
version = "0.1.4"
description = "Small URL helpers for BestVid links."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "BestVid" }
]
keywords = ["bestvid", "ai-video", "url"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries"
]

[project.urls]
Homepage = "https://bestvid.net"
Repository = "https://github.com/bbwdadfg/bestvid-site-kit"
Issues = "https://github.com/bbwdadfg/bestvid-site-kit/issues"

[tool.hatch.build.targets.sdist]
only-include = [
  "bestvid_site_kit",
  "README.md",
  "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["bestvid_site_kit"]
